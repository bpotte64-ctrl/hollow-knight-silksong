<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Silksong Cache</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { color: #00d9ff; }
        button {
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin: 10px 0;
        }
        button:hover { background: #00b8d9; }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background: #2a2a3e;
        }
        .success { background: #1a4a2a !important; }
        .error { background: #4a1a1a !important; }
    </style>
</head>
<body>
    <h1>Hollow Knight: Silksong - Cache Cleaner</h1>
    <p>This will clear all cached game data. Use this if you're experiencing memory errors or corrupted saves.</p>
    <button onclick="clearCache()">Clear All Cache</button>
    <div id="status"></div>

    <script>
        async function clearCache() {
            const status = document.getElementById('status');
            status.textContent = 'Clearing caches...';
            status.className = '';

            try {
                // Clear all caches
                const cacheNames = await caches.keys();
                let deleted = 0;

                for (const name of cacheNames) {
                    if (name.includes('hksilksong') || name.includes('silksong')) {
                        await caches.delete(name);
                        deleted++;
                        console.log('Deleted cache:', name);
                    }
                }

                // Also clear IndexedDB
                const dbNames = await indexedDB.databases();
                for (const db of dbNames) {
                    if (db.name && (db.name.includes('unity') || db.name.includes('silksong'))) {
                        indexedDB.deleteDatabase(db.name);
                        console.log('Deleted IndexedDB:', db.name);
                    }
                }

                status.textContent = `Success! Deleted ${deleted} cache(s). Reload the game now.`;
                status.className = 'success';

                // Auto-redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'index-local.html';
                }, 2000);

            } catch (err) {
                status.textContent = 'Error: ' + err.message;
                status.className = 'error';
                console.error(err);
            }
        }
    </script>
</body>
</html>
