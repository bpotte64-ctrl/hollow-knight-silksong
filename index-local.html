<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="./">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- COOP/COEP headers for SharedArrayBuffer support (required for >2GB memory) -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
    <title>Unity Web Player | Hollow Knight SilkSong</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      body { margin: 0; padding: 0; overflow: hidden; background: #000; }
      #unity-container { width: 100vw; height: 100vh; }
      #unity-canvas { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px; position: absolute; top: 0; left: 0; width: 100%; z-index: 100;"> LOADING...</div>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <!-- Memory patch MUST load before jszip and Unity loader -->
    <script src="js/memory-patch.js"></script>
    <script src="jszip.js"></script>

<script>
// ================== MEMORY CONFIGURATION ==================
// Game needs 4GB+ but WASM32 limit is ~3.7GB usable.
// These settings MUST be applied BEFORE the loader script runs.
// Note: If the Unity build was compiled with lower limits, these won't help.
(function() {
    // Merge with memory-patch.js settings
    window.Module = window.Module || {};

    // Additional runtime error suppression
    window.Module.noInitialRun = false;

    // Runtime initialized hook
    window.Module.onRuntimeInitialized = function() {
        console.log("[Fix] Unity runtime initialized");
    };

    // Catch all errors
    window.Module.onAbort = function(what) {
        console.error("[Fix] Unity aborted:", what);
    };
})();

const loadingText = document.querySelector("#loading-text");
// v3 - forces redownload due to cache corruption issues
const CACHE_NAME = "hksilksongcache-local-v3";

/* ================= PATCH: Canvas Selector Fix ================= */
// Store original functions before Unity overrides them
const originalQuerySelector = document.querySelector.bind(document);
const originalQuerySelectorAll = document.querySelectorAll.bind(document);

// Safe wrapper that validates selectors
document.querySelector = function(selector) {
    if (!selector || selector === "") {
        console.warn("Blocked empty selector query");
        return document.getElementById("unity-canvas");
    }
    return originalQuerySelector(selector);
};

document.querySelectorAll = function(selector) {
    if (!selector || selector === "") {
        console.warn("Blocked empty selector query (all)");
        return [];
    }
    return originalQuerySelectorAll(selector);
};

/* ================= RUNTIME ERROR HANDLER ================= */
let oomDetected = false;

window.addEventListener('error', function(e) {
    if (e.message && (e.message.includes('RuntimeError') || e.message.includes('memory access') || e.message.includes('out of bounds') || e.message.includes('OOM') || e.message.includes('abortOnCannotGrowMemory'))) {
        console.error("[Fix] Caught WASM error:", e);
        e.preventDefault();

        // Mark OOM state
        oomDetected = true;

        // Auto-clear cache on memory errors - corrupted cache can cause memory bloat
        console.warn("[Fix] Clearing ALL caches due to memory error...");
        caches.keys().then(names => {
            names.forEach(name => {
                if (name.includes("hksilksong")) {
                    caches.delete(name);
                    console.log("[Fix] Deleted cache:", name);
                }
            });
            console.warn("[Fix] Cache cleared. RELOAD THE PAGE (Ctrl+Shift+R) to redownload fresh assets.");
        });

        // Also clear IndexedDB which may have corrupted save data
        indexedDB.databases().then(dbs => {
            dbs.forEach(db => {
                if (db.name && (db.name.includes('unity') || db.name.includes('silksong') || db.name.includes('IDBFS'))) {
                    indexedDB.deleteDatabase(db.name);
                    console.log("[Fix] Deleted IndexedDB:", db.name);
                }
            });
        });

        return false;
    }
});

// Intercept console.error for OOM messages
const origConsoleError = console.error;
console.error = function(...args) {
    if (args.some(a => typeof a === 'string' && (a.includes('OOM') || a.includes('abort("OOM")')))) {
        console.warn('[Fix] OOM detected via console.error - clearing cache');
        oomDetected = true;
        caches.keys().then(names => {
            names.forEach(name => {
                if (name.includes("hksilksong")) {
                    caches.delete(name);
                }
            });
        });
    }
    origConsoleError.apply(console, args);
};

/* ================= FETCH OVERRIDE ================= */
const originalFetch = window.fetch;

window.fetch = async function(resource, options) {
  let url = typeof resource === "string" ? resource : resource.url;
  let cleanPath = url.split("/").pop();

  const cache = await caches.open(CACHE_NAME);

  const cachedResponse = await cache.match(cleanPath);
  if (cachedResponse) {
    return cachedResponse;
  }

  return originalFetch(resource, options);
};

/* ================= CACHE CHECK ================= */
async function isCached() {
  const cache = await caches.open(CACHE_NAME);
  const done = await cache.match("CACHE_COMPLETE");
  if (!done) {
    console.log("[Cache] No CACHE_COMPLETE marker, redownloading");
    return false;
  }

  // Validate cache has essential files (not just the marker)
  const cacheKeys = await cache.keys();
  console.log("[Cache] Found", cacheKeys.length, "files");

  // Check if we have a reasonable number of files (should be 150+)
  if (cacheKeys.length < 100) {
    console.warn(`[Cache] Only ${cacheKeys.length} files (expected 150+), forcing redownload`);
    await caches.delete(CACHE_NAME);
    return false;
  }

  // Check for critical bundles that are often missing
  const requiredBundles = [
    "packed-collections_assets_all_40fc2899a4bf13e2fdf4877fac117bfe.bundle",
    "packed-scenes-hornet_scenes_all_c907e217c56bc36e9412cc713b6511b0.bundle",
    "packed-prefabs_assets_all_b19c0cf6b825f4cf18264a6c8f5765a6.bundle"
  ];

  for (const bundle of requiredBundles) {
    const exists = await cache.match(bundle);
    if (!exists) {
      console.warn(`[Cache] Missing required bundle: ${bundle}, forcing redownload`);
      await caches.delete(CACHE_NAME);
      return false;
    }
  }

  console.log("[Cache] Validation passed");
  return true;
}

async function cleanupOldCaches() {
  const cacheNames = await caches.keys();

  await Promise.all(
    cacheNames.map(name => {
      if (name !== CACHE_NAME && name.includes("hksilksong")) {
        console.log("Deleting old cache:", name);
        return caches.delete(name);
      }
    })
  );
}

/* ================= UNZIP ================= */
async function unzipAndStore(zipBlob) {
  if (!zipBlob) {
    throw new Error("ZIP is missing");
  }

  loadingText.textContent = "EXTRACTING ASSETS...";

  const zip = await JSZip.loadAsync(zipBlob);
  const files = Object.values(zip.files).filter(f => !f.dir);
  const total = files.length;

  const cache = await caches.open(CACHE_NAME);

  let processed = 0;
  const batchSize = 10;

  for (let i = 0; i < files.length; i += batchSize) {
    const batch = files.slice(i, i + batchSize);

    await Promise.all(batch.map(async (file) => {
      try {
        const blob = await file.async("blob");
        await cache.put(file.name, new Response(blob));
      } catch (e) {
        console.error("Failed:", file.name, e);
      }

      processed++;
      loadingText.textContent =
        `EXTRACTING ASSETS... (${processed}/${total})`;
    }));

    await new Promise(r => setTimeout(r, 0));
  }

  await cache.put("CACHE_COMPLETE", new Response("ok"));

  console.log("Cache complete");
}

/* ================= DOWNLOAD ================= */
let loadedBytes = 0;

async function fetchWithProgress(url) {
  const response = await originalFetch(url);

  if (!response.ok) {
    throw new Error("Failed to fetch: " + url);
  }

  const reader = response.body.getReader();
  let chunks = [];
  let received = 0;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    received += value.length;
    loadedBytes += value.length;
    chunks.push(value);

    let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
    let mbTotal = '1986.64';

    loadingText.textContent =
      `DOWNLOADING ASSETS... (${mbDone} MB / ${mbTotal} MB)`;
  }

  let fullBuffer = new Uint8Array(received);
  let offset = 0;

  for (let chunk of chunks) {
    fullBuffer.set(chunk, offset);
    offset += chunk.length;
  }

  return fullBuffer.buffer;
}

/* ================= MERGE ================= */
async function mergeFiles(parts) {
  console.log("Downloading parts:", parts.length);

  const buffers = await Promise.all(
    parts.map(part => fetchWithProgress(part))
  );

  return new Blob(buffers);
}

/* ================= UTIL ================= */
function getParts(file, start, end) {
  let parts = [];
  for (let i = start; i <= end; i++) {
    parts.push(file + ".part" + i);
  }
  return parts;
}

/* ================= MAIN ================= */
(async () => {
  try {
    await cleanupOldCaches();
    if (!(await isCached())) {
      loadingText.textContent = "DOWNLOADING ASSETS...";

      const webglzip = await mergeFiles(
        getParts("StreamingAssets/aa/WebGL.zip", 1, 100)
      );

      await unzipAndStore(webglzip);
    } else {
      loadingText.textContent = "LOADING FROM CACHE...";
    }

    /* ================= UNITY START ================= */
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function update() {
        warningBanner.style.display =
          warningBanner.children.length ? 'block' : 'none';
      }

      let div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type == 'error') {
        div.style = 'background:red;padding:10px;';
      } else {
        if (type == 'warning') {
          div.style = 'background:yellow;padding:10px;';
        }
        setTimeout(() => {
          warningBanner.removeChild(div);
          update();
        }, 5000);
      }

      update();
    }

    const buildUrl = "Build";

    const config = {
      dataUrl: buildUrl + "/w-pt.data.unityweb",
      frameworkUrl: buildUrl + "/w-pt.framework.js.unityweb",
      codeUrl: buildUrl + "/w-pt.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "EDUrocks Group, Truffled, GN-Math",
      productName: "Hollow Knight SilkSong",
      productVersion: "1.0",
      showBanner: unityShowBanner,
      // PATCH: Increase memory for save operations
      memoryUrl: undefined,
    };

    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = "Build/w-pt.loader.js"; // LOCAL loader, not CDN

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (progress * 100) + "%";
      })
      .then((unityInstance) => {
        loadingBar.remove();
        loadingText.remove();

        // PATCH: Expose for debugging
        window.unityInstance = unityInstance;
        console.log("Unity instance loaded:", unityInstance);
      })
      .catch((err) => {
        console.error("Unity load error:", err);
        alert("Failed to load: " + err.message);
      });
    };

    document.body.appendChild(script);

  } catch (err) {
    console.error(err);
    loadingText.textContent = "ERROR: " + err.message;
  }
})();
</script>
  </body>
</html>
